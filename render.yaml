services:
  # ChromaDB Vector Database
  - type: web
    name: docmind-chromadb
    runtime: image
    image: docker.io/chromadb/chroma:latest
    plan: free
    envVars:
      - key: IS_PERSISTENT
        value: "TRUE"
      - key: PERSIST_DIRECTORY
        value: /chroma/data
      - key: PORT
        value: 8000
    # Note: Free plan on Render does not support disks.
    # To run in production with persistence, upgrade to a paid service (e.g., Starter) and uncomment the disk configuration:
    # disk:
    #   name: chroma-data
    #   mountPath: /chroma/data
    #   sizeGB: 1

  # Redis (Key Value) Instance
  - type: keyvalue
    name: docmind-redis
    plan: free
    ipAllowList: [] # Restrict access to only internal services

  # FastAPI Backend Service
  - type: web
    name: docmind-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: docmind-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: docmind-postgres
          property: port
      - key: DB_USER
        fromDatabase:
          name: docmind-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: docmind-postgres
          property: password
      - key: DB_NAME
        fromDatabase:
          name: docmind-postgres
          property: database
      - key: DATABASE_URL
        fromDatabase:
          name: docmind-postgres
          property: connectionString
      - key: REDIS_HOST
        fromService:
          name: docmind-redis
          type: keyvalue
          property: host
      - key: REDIS_PORT
        fromService:
          name: docmind-redis
          type: keyvalue
          property: port
      - key: CHROMADB_HOST
        value: docmind-chromadb
      - key: CHROMADB_PORT
        value: 8000
      - key: RUNNING_IN_DOCKER
        value: "True"
      - key: CORS_ORIGINS
        value: "*" # To secure, replace with your Vercel URL once deployed, e.g., "https://your-app.vercel.app"
      - key: NVIDIA_API_KEY
        sync: false # Render prompts the user during blueprint deploy
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: docmind-postgres
    databaseName: docmind
    plan: free
