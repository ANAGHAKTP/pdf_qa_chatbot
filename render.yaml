services:
  # ChromaDB Vector Database
  - type: web
    name: docmind-chromadb
    env: docker
    plan: free
    envVars:
      - key: IS_PERSISTENT
        value: "TRUE"
      - key: PERSIST_DIRECTORY
        value: /chroma/data
      - key: PORT
        value: 8000
    # Note: Free plan on Render does not support disks.
    # To run in production with persistence, upgrade to a paid service (e.g., Starter) and uncomment the disk configuration:
    # disk:
    #   name: chroma-data
    #   mountPath: /chroma/data
    #   sizeGB: 1

  # FastAPI Backend Service
  - type: web
    name: docmind-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: docmind-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: docmind-postgres
          property: port
      - key: DB_USER
        fromDatabase:
          name: docmind-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: docmind-postgres
          property: password
      - key: DB_NAME
        fromDatabase:
          name: docmind-postgres
          property: database
      - key: DATABASE_URL
        fromDatabase:
          name: docmind-postgres
          property: connectionString
      - key: REDIS_HOST
        fromRedis:
          name: docmind-redis
          property: host
      - key: REDIS_PORT
        fromRedis:
          name: docmind-redis
          property: port
      - key: CHROMADB_HOST
        value: docmind-chromadb
      - key: CHROMADB_PORT
        value: 8000
      - key: RUNNING_IN_DOCKER
        value: "True"
      - key: CORS_ORIGINS
        value: "*"
      - key: NVIDIA_API_KEY
        sync: false # Render prompts the user during blueprint deploy
      - key: SECRET_KEY
        generateValue: true

  # Next.js Frontend UI
  - type: web
    name: docmind-frontend
    env: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    plan: free
    envVars:
      - key: DOCMIND_BACKEND_URL
        fromService:
          name: docmind-backend
          type: web
          property: url
      - key: NEXT_PUBLIC_API_URL
        value: ${DOCMIND_BACKEND_URL}/api/v1

databases:
  - name: docmind-postgres
    databaseName: docmind
    user: postgres
    plan: free

redis:
  - name: docmind-redis
    plan: free
