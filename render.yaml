services:
  # FastAPI Backend Service
  - type: web
    name: docmind-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: starter
    disk:
      name: docmind-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /app/data
      - key: UPLOAD_DIR
        value: /app/data/uploads
      - key: CHROMADB_HOST
        value: localhost
      - key: RUNNING_IN_DOCKER
        value: "True"
      - key: EMAIL_VERIFICATION_ENABLED
        value: "False"
      - key: FRONTEND_URL
        value: "https://pdf-qa-chatbot-rho.vercel.app"
      - key: CORS_ORIGINS
        value: "https://pdf-qa-chatbot-rho.vercel.app"
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard (e.g. Supabase connection string)
      - key: REDIS_HOST
        value: "" # Optional Redis host (leave empty if not using Redis)
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        value: ""
      - key: NVIDIA_API_KEY
        sync: false # Render prompts the user during blueprint deploy
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

