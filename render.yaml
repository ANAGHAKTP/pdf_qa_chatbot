services:
  # FastAPI Backend Service
  - type: web
    name: docmind-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    envVars:
      - key: RUNNING_IN_DOCKER
        value: "True"
      - key: USE_S3
        value: "True"
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: "us-east-1"
      - key: AWS_BUCKET_NAME
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: EMAIL_VERIFICATION_ENABLED
        value: "False"
      - key: FRONTEND_URL
        value: "https://pdf-qa-chatbot-rho.vercel.app"
      - key: CORS_ORIGINS
        value: "https://pdf-qa-chatbot-rho.vercel.app"
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard (e.g. Supabase connection string)
      - key: REDIS_HOST
        value: "" # Optional Redis host (leave empty if not using Redis)
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        value: ""
      - key: NVIDIA_API_KEY
        sync: false # Render prompts the user during blueprint deploy
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

